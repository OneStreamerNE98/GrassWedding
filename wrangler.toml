# Cloudflare Pages configuration — source of truth for bindings.
# NOTE: with this file present, Pages ignores dashboard-configured bindings
# and plain-text variables (secrets set via dashboard/API still apply).
# See DEPLOYMENT.md step 2.

name = "grasswedding"
pages_build_output_dir = "."
compatibility_date = "2026-08-01"

[vars]
RSVP_EMAIL_FROM = "Nicole + Jason RSVP <rsvp@grass.wedding>"
RSVP_EMAIL_TO = "jasongrass@gmail.com"

[[d1_databases]]
binding = "RSVP_DB"
database_name = "wedding-rsvp"
database_id = "1bd330a6-7a45-474a-94b3-efe97eaaa6d3"

# Preview deployments get their own database so test RSVPs never pollute the real list.
[env.preview.vars]
RSVP_EMAIL_FROM = "Nicole + Jason RSVP <rsvp@grass.wedding>"
RSVP_EMAIL_TO = "jasongrass@gmail.com"

[[env.preview.d1_databases]]
binding = "RSVP_DB"
database_name = "wedding-rsvp-preview"
database_id = "ce4a587b-6df7-4b3b-b838-d47a286e0ca2"

# Secrets are NOT set here (TURNSTILE_SECRET, SITE_PASSPHRASE, RESEND_API_KEY):
# they were written to the Pages project by scripts/setup_cloudflare.py and can
# be updated later via `npx wrangler pages secret put <NAME>` or the dashboard.
